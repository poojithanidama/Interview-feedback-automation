


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin Registration</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --accent1: #42a5f5;
      --accent2: #5e35b1;
      --danger: #e53935;
      --success: #28a745;
      --warning: #ffca28;
      --muted: #6b7280;
      --card-bg: rgba(255,255,255,0.92);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background: linear-gradient(120deg,#e6f0fb 0%, #f6f2fb 100%);
      color:#222;
      -webkit-font-smoothing:antialiased;
    }

    /* Header */
    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 26px;
      background: linear-gradient(90deg,var(--accent1),var(--accent2));
      color: #fff;
      box-shadow: 0 4px 12px rgba(18,18,18,0.12);
      position:sticky;
      top:0;
      z-index:100;
    }
    .logo img{ height:66px; display:block; }

    /* Profile */
    .profile-wrapper{ position:relative; cursor:pointer; display:flex; align-items:center; gap:12px; }
    .profile-pic{ width:46px; height:46px; border-radius:50%; object-fit:cover; border:2px solid #fff; }
    .profile-name{ font-weight:600; color:#fff; }

    .dropdown-menu{
      display:none;
      position:absolute;
      right:0;
      top:62px;
      min-width:170px;
      background:#fff;
      border-radius:10px;
      box-shadow: 0 8px 20px rgba(1,1,1,0.12);
      overflow:hidden;
      z-index:2000;
    }
    .dropdown-menu a{
      display:block;
      padding:10px 14px;
      color:#333;
      text-decoration:none;
      font-weight:500;
      border-bottom:1px solid #f1f1f1;
    }
    .dropdown-menu a:last-child{ border-bottom:none; }
    .dropdown-menu a:hover{ background:#fafafa; }

    /* Container */
    .container{
      max-width:760px;
      margin:44px auto;
      background:var(--card-bg);
      padding:34px 42px;
      border-radius:14px;
      box-shadow: 0 18px 38px rgba(15,15,15,0.09);
      backdrop-filter: blur(4px);
    }
    h1{ text-align:center; color:#41207a; margin:0 0 18px; font-size:26px; font-weight:600; }

    /* Flash */
    .flash{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 16px;
      border-radius:10px;
      font-weight:600;
      margin-bottom:18px;
      font-size:15px;
      animation: pop .28s ease;
    }
    .flash.success{ background:#e6f6ea; color:var(--success); border-left:6px solid var(--success); }
    .flash.warning{ background:#fff9e6; color:var(--warning); border-left:6px solid var(--warning); }
    .flash.danger, .flash.error{ background:#fbeaea; color:var(--danger); border-left:6px solid var(--danger); }
    @keyframes pop{ from{opacity:0; transform:translateY(-6px) scale(.99)} to{opacity:1; transform:none} }

    /* Form */
    form{ margin-top:6px; }
    .row{ display:flex; gap:18px; }
    .col{ flex:1; }

    label{ display:block; margin-top:14px; color:#2b2b2b; font-weight:600; font-size:14px; }
    .required::after{ content:" *"; color:var(--danger); margin-left:3px; font-weight:700; }

    input[type="text"], input[type="email"], input[type="date"], select{
      width:100%;
      padding:12px 14px;
      margin-top:8px;
      border-radius:10px;
      border:1px solid #d1d5db;
      background:#fff;
      font-size:15px;
      transition: box-shadow .18s, border-color .18s;
    }
    input:focus, select:focus{
      outline:none;
      border-color:var(--accent2);
      box-shadow: 0 6px 18px rgba(94,53,177,0.08);
    }

    .error-msg{ color:var(--danger); font-weight:600; font-size:13px; margin-top:8px; min-height:18px; }
    .ok-msg{ color:var(--success); font-weight:600; font-size:13px; margin-top:8px; min-height:18px; }

    /* Buttons */
    .button-row{ display:flex; gap:18px; margin-top:22px; }
    button{
      flex:1;
      padding:12px 14px;
      font-size:15px;
      border-radius:10px;
      border:none;
      cursor:pointer;
      font-weight:700;
    }
    .submit-btn{
      background: linear-gradient(90deg,var(--accent1),var(--accent2));
      color:white;
      box-shadow: 0 6px 18px rgba(69,39,160,0.12);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .submit-btn:disabled{
      opacity:.56; cursor:not-allowed; transform:none; box-shadow:none;
    }
    .submit-btn:hover:not(:disabled){ transform:translateY(-2px); }

    .cancel-btn{ background:#ef5350; color:white; }
    .cancel-btn:hover{ transform:translateY(-2px); box-shadow: 0 8px 18px rgba(229,57,53,0.12); }

    .back { margin-top:20px; text-align:center; }
    .back a{ text-decoration:none; color:#fff; background:#3949ab; padding:10px 18px; border-radius:8px; font-weight:600; }

    @media (max-width:720px){
      .row{ flex-direction:column; }
      .header{ padding:12px 14px; }
      .container{ margin:20px 12px; padding:22px; }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <div class="logo"><img src="{{ url_for('static', filename='logo.png') }}" alt="Logo"></div>

    <div class="profile-wrapper" onclick="toggleDropdown()">
      <img class="profile-pic"
           src="{{ url_for('static', filename=session.get('profile_pic', 'profile_photo/defaultpicture.jpg')) }}"
           alt="Profile pic">
      <div class="profile-name">{{ session.get('username','Admin') }}</div>

      <div id="profileMenu" class="dropdown-menu">
        <a href="{{ url_for('profile') }}">Profile</a>
        <a href="{{ url_for('settings') }}">Settings</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      </div>
    </div>
  </div>

  <!-- Main Container -->
  <div class="container">
    <h1>Admin Registration</h1>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="flash {{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Registration Form -->
    <form method="POST" action="{{ url_for('admin_register') }}" novalidate id="adminRegisterForm">

      <!-- Row 1: First + Last -->
      <div class="row">
        <div class="col">
          <label class="required">First name</label>
          <input type="text" name="first_name" id="firstName"/>
          <div id="firstNameError" class="error-msg"></div>
        </div>

        <div class="col">
          <label class="required">Last name</label>
          <input type="text" name="last_name" id="lastName"/>
          <div id="lastNameError" class="error-msg"></div>
        </div>
      </div>

      <!-- Email -->
      <label class="required">Email</label>
      <input type="email" name="email" id="email"/>
      <div id="emailError" class="error-msg"></div>
      <div id="emailOk" class="ok-msg" style="display:none;"></div>

      <!-- Phone -->
      <label class="required">Phone (10 digits)</label>
      <input type="text" name="phone" id="phone" maxlength="10" inputmode="numeric"/>
      <div id="phoneError" class="error-msg"></div>
      <div id="phoneOk" class="ok-msg" style="display:none;"></div>

      <!-- Location -->
      <label class="required">Location</label>
      <input type="text" name="location" id="location"/>
      <div id="locationError" class="error-msg"></div>

      <!-- Course + Language -->
<div class="row">
  <div class="col">
    <label class="required">Course</label>
    <select name="course" id="courseSelect">
      <option value="">-- Select Course --</option>
      {% for c in courses %}
        <option value="{{ c.id }}">{{ c.course_name }}</option>
      {% endfor %}
    </select>
    <div id="courseError" class="error-msg"></div>
  </div>

  <div class="col">
    <label class="required">Language</label>
    <select name="language" id="languageSelect">
      <option value="">-- Select Language --</option>
      {% for l in languages %}
        <option value="{{ l.id }}">{{ l.language }}</option>
      {% endfor %}
    </select>
    <div id="languageError" class="error-msg"></div>
  </div>
</div>


      <!-- Start Date -->
      <label class="required">Start date</label>
      <input type="date" name="start_date" id="startDate"/>
      <div id="dateError" class="error-msg"></div>

      <!-- Buttons -->
      <div class="button-row">
        <button type="button" class="cancel-btn" onclick="window.location.href='/'">Cancel</button>
        <button type="submit" id="submitBtn" class="submit-btn" disabled>Submit</button>
      </div>

      <div class="back">
        <a href="{{ url_for('resources') }}">← Back to Resources</a>
      </div>

    </form>
  </div>

  <script>
/* ---------------- PROFILE DROPDOWN ---------------- */
function toggleDropdown(){
  const menu = document.getElementById('profileMenu');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}

document.addEventListener('click', function(e){
  const wrapper = document.querySelector('.profile-wrapper');
  const menu = document.getElementById('profileMenu');
  if(wrapper && !wrapper.contains(e.target)){
    menu.style.display = 'none';
  }
});

/* --------------- VALIDATION --------------- */

const firstName=document.getElementById('firstName');
const lastName=document.getElementById('lastName');
const email=document.getElementById('email');
const phone=document.getElementById('phone');
const locationF=document.getElementById('location');
const course=document.getElementById('courseSelect');
const language=document.getElementById('languageSelect');
const startDate=document.getElementById('startDate');
const submitBtn=document.getElementById('submitBtn');

const firstNameError=document.getElementById('firstNameError');
const lastNameError=document.getElementById('lastNameError');
const emailError=document.getElementById('emailError');
const emailOk=document.getElementById('emailOk');
const phoneError=document.getElementById('phoneError');
const phoneOk=document.getElementById('phoneOk');
const locationError=document.getElementById('locationError');
const courseError=document.getElementById('courseError');
const languageError=document.getElementById('languageError');
const dateError=document.getElementById('dateError');

const state={firstName:false,lastName:false,email:false,phone:false,location:false,course:false,language:false,date:false};

function setError(node,msg){node.textContent=msg;node.style.display=msg?'block':'none';}
function setOk(node,msg){if(msg){node.style.display='block';node.textContent=msg;}else{node.style.display='none';node.textContent='';}}

function validEmailDomain(v){
  const lower=v.toLowerCase().trim();
  const domainValid=lower.endsWith("@gmail.com")||lower.endsWith("@chakorahub.com");
  const formatValid=/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(lower);
  return domainValid&&formatValid;
}

function validateFirstName(){const v=firstName.value.trim();if(!v){state.firstName=false;setError(firstNameError,"First name is required.");} else{state.firstName=true;setError(firstNameError,"");}toggleSubmit();}
function validateLastName(){if(!state.firstName){setError(lastNameError,"Please fill first name first.");state.lastName=false;toggleSubmit();return;}const v=lastName.value.trim();if(!v){state.lastName=false;setError(lastNameError,"Last name is required.");} else{state.lastName=true;setError(lastNameError,"");}toggleSubmit();}
function validateEmail(){if(!state.firstName||!state.lastName){setError(emailError,"Complete name first.");state.email=false;setOk(emailOk,"");toggleSubmit();return;}const v=email.value.trim();if(!v){state.email=false;setError(emailError,"Email is required.");setOk(emailOk,"");} else if(!validEmailDomain(v)){state.email=false;setError(emailError,"Must end with @gmail.com or @chakorahub.com");setOk(emailOk,"");} else{state.email=true;setError(emailError,"");setOk(emailOk,"Email looks good.");}toggleSubmit();}
function validatePhone(){if(!state.email){setError(phoneError,"Please complete email first.");state.phone=false;setOk(phoneOk,"");toggleSubmit();return;}const v=phone.value.trim();if(!v){state.phone=false;setError(phoneError,"Phone required.");setOk(phoneOk,"");} else if(!/^\d+$/.test(v)){state.phone=false;setError(phoneError,"Digits only.");setOk(phoneOk,"");} else if(v.length!==10){state.phone=false;setError(phoneError,"Must be exactly 10 digits.");setOk(phoneOk,"");} else{state.phone=true;setError(phoneError,"");setOk(phoneOk,"Phone looks good.");}toggleSubmit();}
function validateLocation(){if(!state.phone){setError(locationError,"Complete phone first.");state.location=false;toggleSubmit();return;}const v=locationF.value.trim();if(!v){state.location=false;setError(locationError,"Location required.");} else{state.location=true;setError(locationError,"");}toggleSubmit();}
function validateCourse(){if(!state.location){setError(courseError,"Complete location first.");state.course=false;toggleSubmit();return;}const v=course.value;if(!v){state.course=false;setError(courseError,"Select a course.");} else{state.course=true;setError(courseError,"");}toggleSubmit();}
function validateLanguage(){if(!state.course){setError(languageError,"Select course first.");state.language=false;toggleSubmit();return;}const v=language.value;if(!v){state.language=false;setError(languageError,"Select a language.");} else{state.language=true;setError(languageError,"");}toggleSubmit();}
function validateDate(){if(!state.language){setError(dateError,"Select language first.");state.date=false;toggleSubmit();return;}const v=startDate.value;if(!v){state.date=false;setError(dateError,"Start date required.");} else{const d=new Date(v),t=new Date();t.setHours(0,0,0,0);if(d<t){state.date=false;setError(dateError,"Date cannot be past.");} else{state.date=true;setError(dateError,"");}}toggleSubmit();}
function toggleSubmit(){submitBtn.disabled=!Object.values(state).every(v=>v===true);}

firstName.addEventListener('input',validateFirstName);
lastName.addEventListener('input',validateLastName);
email.addEventListener('input',validateEmail);
phone.addEventListener('input',validatePhone);
locationF.addEventListener('input',validateLocation);
course.addEventListener('change',validateCourse);
language.addEventListener('change',validateLanguage);
startDate.addEventListener('change',validateDate);

/* ---------------- FINAL SUBMIT HANDLER (FIXED) ---------------- */

document.addEventListener("DOMContentLoaded", function () {
  const form = document.getElementById("adminRegisterForm");

  console.log("JS Loaded. form=", form);

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    console.log("Submit clicked → running validation + JSON submit");

    // Run validation again before submit
    validateFirstName();
    validateLastName();
    validateEmail();
    validatePhone();
    validateLocation();
    validateCourse();
    validateLanguage();
    validateDate();

    if (!Object.values(state).every(v=>v===true)) {
      console.warn("Form invalid → not submitting");
      return;
    }

    const payload = {
      first_name: firstName.value.trim(),
      last_name: lastName.value.trim(),
      email: email.value.trim(),
      phone: phone.value.trim(),
      location: locationF.value.trim(),
      course: course.value,
      language: language.value,
      start_date: startDate.value
    };

    console.log("Sending JSON payload:", payload);

    fetch("/admin-register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
      console.log("Response from server:", data);
      alert(data.message);
    })
    .catch(err => console.error("Error:", err));
  });
});
</script>


</body>
</html>
