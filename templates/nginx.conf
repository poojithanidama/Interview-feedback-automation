worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # -------------------------------------------------------------
    # ChakoraHub site configuration
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name chakorahub.com www.chakorahub.com localhost;

        # Serve static meeting HTML
        location /meeting {
            root C:\vsrsubhash\templates;
            index meeting.html;
            try_files /meeting.html =404;
        }

        # ✅ Reverse proxy to Lambda (via Function URL)
        location /meeting/api/ {
            proxy_pass https://lwug4xhfz27whiuu3acjfwsgtm0ttwja.lambda-url.eu-north-1.on.aws/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept';
        }

        # Default error page (optional)
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
