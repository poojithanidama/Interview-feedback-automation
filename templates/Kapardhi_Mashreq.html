<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Export Bill Guidance</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
background:#f2f5fa;
font-family:Segoe UI;
}

.section{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.section-title{
font-weight:600;
border-bottom:2px solid #0d6efd;
margin-bottom:15px;
padding-bottom:5px;
}

.info-icon{
color:#0d6efd;
margin-left:6px;
cursor:pointer;
}

.help{
font-size:12px;
color:#6c757d;
}

</style>

</head>

<body>

<div class="container my-4">

<h4 class="text-center mb-4">Export Bill Form Guidance</h4>

<!-- SECTION 1 -->

<div class="section">

<div class="section-title">Header</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>
Account Number
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Enter your Mashreq account number">
</i>
</label>

<input class="form-control"
placeholder="Eg: 123456789">

</div>

<div class="col-md-6 mb-3">

<label>
Date
<i class="bi bi-info-circle info-icon"
title="Date of submission"
data-bs-toggle="tooltip">
</i>
</label>

<input class="form-control"
placeholder="DD/MM/YYYY">

</div>

</div>

</div>

<!-- SECTION 2 -->

<div class="section">

<div class="section-title">Beneficiary Details</div>

<div class="row">

<div class="col-12 mb-3">
<label>
Drawer / Beneficiary Name
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Name of the drawer or beneficiary company (e.g., ABC Exports Pvt Ltd)">
</i>
</label>
<input class="form-control" placeholder="Drawer / Beneficiary Name (Eg: ABC Exports Pvt Ltd)">
</div>

<div class="col-md-6 mb-3">
<label>
Fax Number
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Fax number of the drawer/beneficiary">
</i>
</label>
<input class="form-control" placeholder="Fax Number">
</div>

<div class="col-md-6 mb-3">
<label>
Telephone Number
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Telephone number of the drawer/beneficiary">
</i>
</label>
<input class="form-control" placeholder="Telephone Number">
</div>

<div class="col-12 mb-3">
<label>
Address
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Complete address of the drawer/beneficiary">
</i>
</label>
<input class="form-control" placeholder="Address">
</div>

<div class="col-12 mb-3">
<label>
Drawee / Consignee Name
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Name of the drawee or consignee company">
</i>
</label>
<input class="form-control" placeholder="Drawee / Consignee Name">
</div>

<div class="col-md-6 mb-3">
<label>
Fax Number
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Fax number of the drawee/consignee">
</i>
</label>
<input class="form-control" placeholder="Fax Number">
</div>

<div class="col-md-6 mb-3">
<label>
Telephone Number
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Telephone number of the drawee/consignee">
</i>
</label>
<input class="form-control" placeholder="Telephone Number">
</div>

<div class="col-12 mb-3">
<label>
Address
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Complete address of the drawee/consignee">
</i>
</label>
<input class="form-control" placeholder="Address">
</div>

</div>

</div>

<!-- SECTION 3 -->

<div class="section">

<div class="section-title">Bill of Exchange</div>

<div class="row">

<div class="col-md-6 mb-3">
<label>
Sight
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Payment terms - Sight means payable on presentation">
</i>
</label>
<input class="form-control" placeholder="Sight">
</div>

<div class="col-md-6 mb-3">
<label>
Days after sight
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Number of days after presentation when payment is due">
</i>
</label>
<input class="form-control" placeholder="Days after sight">
</div>

<div class="col-12 mb-3">
<label>
Other please specify
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Specify any other payment terms not covered above">
</i>
</label>
<input class="form-control" placeholder="Other please specify">
</div>

<div class="col-12 mb-3">
<label>
Collecting Bank Name
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Name of the bank that will collect the payment">
</i>
</label>
<input class="form-control" placeholder="Collecting Bank Name">
</div>

<div class="col-md-6 mb-3">
<label>
Bill Currency
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Currency in which the bill is denominated (e.g., USD, EUR)">
</i>
</label>
<input class="form-control" placeholder="Bill Currency (Eg: USD)">
</div>

<div class="col-md-6 mb-3">
<label>
Amount
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Total amount of the bill in the specified currency">
</i>
</label>
<input class="form-control" placeholder="Amount (Eg: 10000)">
</div>

<div class="col-12 mb-3">
<label>
Brief Description of Goods
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Short description of the goods being exported">
</i>
</label>
<input class="form-control" placeholder="Brief Description of Goods">
</div>

<div class="col-12 mb-3">
<label>
Additional Notes
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Any additional information or special instructions">
</i>
</label>
<input class="form-control" placeholder="Additional Notes">
</div>

</div>

</div>

<!-- SECTION 4 -->

<div class="section">

<div class="section-title">
Instructions for bills NOT under LC
</div>

<div class="row">

<div class="col-md-4 mb-3">
<label>
Interest %
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Interest rate percentage for delayed payment">
</i>
</label>
<input class="form-control" placeholder="Interest %">
</div>

<div class="col-md-4 mb-3">
<label>
Interest From Date
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Date from which interest calculation begins">
</i>
</label>
<input class="form-control" placeholder="Interest From Date">
</div>

<div class="col-md-4 mb-3">
<label>
Interest Until Date
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Date until which interest is calculated">
</i>
</label>
<input class="form-control" placeholder="Interest Until Date">
</div>

</div>

<div class="mt-3">

<label>
<input type="checkbox">
Release documents against payment (DP)
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Documents will be released only after payment is received">
</i>
</label><br>

<label>
<input type="checkbox">
Release documents against acceptance (DA)
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Documents will be released after bill acceptance">
</i>
</label><br>

<label>
<input type="checkbox">
Protest for non acceptance
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Bank will protest if bill is not accepted">
</i>
</label><br>

<label>
<input type="checkbox">
Do not protest
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="No protest action will be taken">
</i>
</label><br>

<label>
<input type="checkbox">
Collect overseas charges
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Bank will collect all overseas charges">
</i>
</label><br>

<label>
<input type="checkbox">
Deduct charges from proceeds
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="All bank charges will be deducted from payment proceeds">
</i>
</label><br>

<label>
<input type="checkbox">
Waive interest if refused
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Interest will be waived if payment is refused">
</i>
</label><br>

<label>
<input type="checkbox">
Do not waive interest
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Interest will not be waived even if payment is refused">
</i>
</label><br>

<label>
<input type="checkbox">
Discounting required
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Bill discounting facility is required">
</i>
</label><br>

<label>
<input type="checkbox">
Discounting not required
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="No bill discounting is needed">
</i>
</label><br>

<label>
<input type="checkbox">
Attach discounting request
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Discounting request document must be attached">
</i>
</label><br>

</div>

</div>

<!-- SECTION 5 -->

<div class="section">

<div class="section-title">Documents under Export LC</div>

<div class="row">

<div class="col-12 mb-3">
<label>
Documentary Credit Number
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="LC number issued by the issuing bank">
</i>
</label>
<input class="form-control" placeholder="Documentary Credit Number">
</div>

<div class="col-12 mb-3">
<label>
Issued by Bank Branch
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Name and branch of the bank that issued the LC">
</i>
</label>
<input class="form-control" placeholder="Issued by Bank Branch">
</div>

<div class="col-12 mb-3">
<label>
Present documents through
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Specify how and through which bank documents should be presented">
</i>
</label>
<input class="form-control" placeholder="Present documents through">
</div>

</div>

<label>
<input type="checkbox">
Discounting at our risk
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Bank will discount the bill at exporter's risk">
</i>
</label><br>

<label>
<input type="checkbox">
Negotiation under Documentary credit
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Bill will be negotiated under LC terms">
</i>
</label><br>

<label>
<input type="checkbox">
Forward for Negotiation
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Documents will be forwarded to issuing bank for negotiation">
</i>
</label><br>

<label>
<input type="checkbox">
Fax copy of advice
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Fax copy of payment advice will be sent">
</i>
</label><br>

<label>
<input type="checkbox">
Approval under LC protection
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Transaction is protected under LC terms">
</i>
</label><br>

<label>
<input type="checkbox">
Purchase upon acceptance
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Bank will purchase the bill upon acceptance">
</i>
</label><br>

<label>
<input type="checkbox">
Restricted
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="LC has restrictions on negotiation">
</i>
</label><br>

<label>
<input type="checkbox">
Non restricted
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="LC has no restrictions on negotiation">
</i>
</label><br>

<label>
<input type="checkbox">
Collect charges
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Bank will collect all applicable charges">
</i>
</label><br>

<label>
<input type="checkbox">
Store and insure goods
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Goods will be stored and insured by bank if needed">
</i>
</label><br>

<label>
<input type="checkbox">
Other instruction
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Specify any other special instructions">
</i>
</label><br>

</div>

<!-- SECTION 6 -->

<div class="section">

<div class="section-title">Number of Documents Attached</div>

<div class="row">

<div class="col-md-6 mb-3">
<label>
Draft
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Number of draft copies attached">
</i>
</label>
<input class="form-control" placeholder="Draft">
</div>

<div class="col-md-6 mb-3">
<label>
Packing / Weight List
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Number of packing/weight list documents attached">
</i>
</label>
<input class="form-control" placeholder="Packing / Weight List">
</div>

<div class="col-md-6 mb-3">
<label>
Commercial Invoice
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Number of commercial invoice copies attached">
</i>
</label>
<input class="form-control" placeholder="Commercial Invoice">
</div>

<div class="col-md-6 mb-3">
<label>
Insurance Policy Certificate
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Number of insurance policy certificates attached">
</i>
</label>
<input class="form-control" placeholder="Insurance Policy Certificate">
</div>

<div class="col-md-6 mb-3">
<label>
Visa / Consular Invoice
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Number of visa/consular invoice documents attached">
</i>
</label>
<input class="form-control" placeholder="Visa / Consular Invoice">
</div>

<div class="col-md-6 mb-3">
<label>
Certificate of Origin
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Number of certificate of origin documents attached">
</i>
</label>
<input class="form-control" placeholder="Certificate of Origin">
</div>

<div class="col-md-6 mb-3">
<label>
Original Bills of Lading
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Number of original bills of lading attached">
</i>
</label>
<input class="form-control" placeholder="Original Bills of Lading">
</div>

<div class="col-md-6 mb-3">
<label>
Non Negotiable Bills of Lading
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Number of non-negotiable bills of lading attached">
</i>
</label>
<input class="form-control" placeholder="Non Negotiable Bills of Lading">
</div>

<div class="col-md-6 mb-3">
<label>
Inspection Certificate
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Number of inspection certificates attached">
</i>
</label>
<input class="form-control" placeholder="Inspection Certificate">
</div>

<div class="col-md-6 mb-3">
<label>
Delivery / Truck Consignment Note
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Number of delivery/truck consignment notes attached">
</i>
</label>
<input class="form-control" placeholder="Delivery / Truck Consignment Note">
</div>

<div class="col-md-6 mb-3">
<label>
Air Way Bill
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Number of air way bills attached">
</i>
</label>
<input class="form-control" placeholder="Air Way Bill">
</div>

</div>

</div>

<!-- SECTION 7 -->

<div class="section">

<div class="section-title">Proceeds Disposal</div>

<div class="row">

<div class="col-12 mb-3">
<label>
Credit our account number
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Account number where proceeds should be credited">
</i>
</label>
<input class="form-control" placeholder="Credit our account number">
</div>

<div class="col-12 mb-3">
<label>
Debit our account number
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Account number from which charges should be debited">
</i>
</label>
<input class="form-control" placeholder="Debit our account number">
</div>

<div class="col-12 mb-3">
<label>
Authorized Signatory Name
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Name of the authorized person signing this form">
</i>
</label>
<input class="form-control" placeholder="Authorized Signatory Name">
</div>

</div>

</div>

<!-- SECTION 8 -->

<div class="section">

<div class="section-title">For Bank Use Only</div>

<label>
<input type="checkbox">
Non Restricted
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Bill is not restricted and can be negotiated freely">
</i>
</label><br>

<label>
<input type="checkbox">
Restricted with / without recourse
<i class="bi bi-info-circle info-icon"
data-bs-toggle="tooltip"
title="Bill has restrictions on negotiation, with or without recourse to exporter">
</i>
</label><br>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

const tooltipTriggerList =
document.querySelectorAll('[data-bs-toggle="tooltip"]')

const tooltipList =
[...tooltipTriggerList].map(el => new bootstrap.Tooltip(el))

</script>

</body>
</html>
