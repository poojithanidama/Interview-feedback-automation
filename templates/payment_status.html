<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Status — ChakoraHub</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">

  <style>
    /* ── Design tokens (matches create_link.html) ── */
    :root {
      --navy:        #0d1b2a;
      --navy-card:   #112240;
      --gold:        #c8932f;
      --gold-lt:     #e8b84b;
      --border:      rgba(255,255,255,0.10);
      --text:        #e2e8f0;
      --muted:       #7f93ad;

      /* status colours */
      --ok-text:     #6ee7b7;
      --ok-bg:       rgba(16,185,129,0.12);
      --ok-bdr:      rgba(16,185,129,0.35);
      --ok-icon:     #34d399;

      --pending-text: #fcd34d;
      --pending-bg:   rgba(245,158,11,0.12);
      --pending-bdr:  rgba(245,158,11,0.35);
      --pending-icon: #fbbf24;

      --failed-text:  #fca5a5;
      --failed-bg:    rgba(239,68,68,0.12);
      --failed-bdr:   rgba(239,68,68,0.35);
      --failed-icon:  #f87171;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--navy);
      background-image:
        radial-gradient(ellipse at 10% 15%,  rgba(200,147,47,0.12) 0%, transparent 55%),
        radial-gradient(ellipse at 90% 80%,  rgba(13,100,200,0.14) 0%, transparent 55%),
        radial-gradient(ellipse at 55% 50%,  rgba(118,75,162,0.08) 0%, transparent 60%);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ── Brand mark ── */
    .brand-row {
      display: flex;
      align-items: center;
      gap: .55rem;
      margin-bottom: 2rem;
      color: var(--gold-lt);
      font-family: 'Sora', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -.01em;
    }

    .brand-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px rgba(200,147,47,0.55);
    }

    /* ── Status card ── */
    .status-card {
      width: 100%;
      max-width: 420px;
      background: var(--navy-card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 24px 60px rgba(0,0,0,0.50),
        0 0 80px rgba(200,147,47,0.05);
      padding: 2.8rem 2rem 2.2rem;
      text-align: center;
    }

    /* ── Initial checking state (visible before JS updates #app) ── */
    .checking-icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 1.2rem;
      animation: pulse-spin 1.6s ease-in-out infinite;
      color: var(--muted);
    }

    @keyframes pulse-spin {
      0%, 100% { opacity: .6; transform: scale(1);    }
      50%       { opacity: 1;  transform: scale(1.08); }
    }

    .checking-title {
      font-family: 'Sora', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: .5rem;
      letter-spacing: -.02em;
    }

    .checking-sub {
      font-size: .875rem;
      color: var(--muted);
    }

    /* ── Progress dots (shown while PENDING) ── */
    .dots {
      display: inline-flex;
      gap: .4rem;
      margin-top: 1.5rem;
      justify-content: center;
    }

    .dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gold);
      opacity: .3;
      animation: dotBounce 1.2s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: .18s; }
    .dots span:nth-child(3) { animation-delay: .36s; }

    @keyframes dotBounce {
      0%, 80%, 100% { opacity: .25; transform: scale(.8); }
      40%           { opacity: 1;   transform: scale(1.2); }
    }

    /* ── Status result panel — injected by JS into #app ── */

    /* .ok class — used by JS: h1.ok */
    .ok {
      color: var(--ok-text) !important;
    }

    /* .failed class — used by JS: h1.failed */
    .failed {
      color: var(--failed-text) !important;
    }

    /* .pending class — used by JS (if any) */
    .pending {
      color: var(--pending-text) !important;
    }

    /* Icon wrapper that wraps the emoji in JS-injected HTML */
    .icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 1rem;
      animation: iconPop .4s cubic-bezier(.34,1.56,.64,1) both;
    }

    @keyframes iconPop {
      from { opacity: 0; transform: scale(.5); }
      to   { opacity: 1; transform: scale(1);  }
    }

    /* h1 inside #app */
    #app h1 {
      font-family: 'Sora', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      margin: .5rem 0 .75rem;
      letter-spacing: -.02em;
      animation: fadeUp .35s ease both;
    }

    /* p inside #app */
    #app p {
      font-size: .9rem;
      color: var(--muted);
      line-height: 1.6;
      animation: fadeUp .35s .08s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    /* Status pill that appears beneath the message */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .35rem 1rem;
      border-radius: 50px;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-top: 1.25rem;
    }

    .status-pill.ok     { background: var(--ok-bg);      border: 1px solid var(--ok-bdr);      color: var(--ok-text);     }
    .status-pill.failed { background: var(--failed-bg);   border: 1px solid var(--failed-bdr);   color: var(--failed-text); }

    /* Reference badge */
    .ref-badge {
      display: inline-block;
      margin-top: .9rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .45rem 1rem;
      font-size: .82rem;
      color: var(--muted);
      font-family: 'Inter', monospace;
      letter-spacing: .03em;
      word-break: break-all;
    }

    .ref-badge strong { color: var(--text); }

    /* ── Divider ── */
    .card-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.75rem auto;
      width: 60%;
    }

    /* ── Footer ── */
    .footer-note {
      margin-top: 2rem;
      font-size: .77rem;
      color: rgba(127,147,173,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
    }

    @media (max-width: 480px) {
      .status-card { padding: 2rem 1.3rem 1.6rem; }
    }
  </style>
</head>
<body>

  <!-- Brand -->
  <div class="brand-row">
    <span class="brand-dot"></span>
    ChakoraHub
  </div>

  <!-- Status card -->
  <div class="status-card">

    <!-- Initial state — JS replaces inner #app content on first poll -->
    <div id="app">
      <i class="bi bi-arrow-repeat checking-icon"></i>
      <div class="checking-title">Checking payment status…</div>
      <div class="checking-sub">This usually takes just a moment.</div>
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <hr class="card-divider">

    <div class="footer-note">
      <i class="bi bi-shield-check"></i>
      Secured by ChakoraHub Payments
    </div>

  </div>

  <div class="footer-note" style="margin-top:1.5rem">
    <i class="bi bi-lock-fill"></i>
    Your payment data is encrypted end-to-end.
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ═══════════════════════════════════════════════
       ORIGINAL JS — ZERO CHANGES
  ═══════════════════════════════════════════════ -->
  <script>
    // token_id may come from route variable or query string fallback.
    const params = new URLSearchParams(window.location.search);
    const routeTokenId = "{{ token_id if token_id is defined else '' }}";
    const tokenId = routeTokenId || params.get('token');
    const app = document.getElementById('app');

    async function poll() {
      if (!tokenId) {
        app.innerHTML = `<h1 class="failed">Missing payment reference</h1>`;
        return;
      }
      try {
        const res = await fetch(`/admin/payment-link-status/${tokenId}`);
        const data = await res.json();

        if (data.status === 'PAID') {
          const amountLine = (data.amount !== null && data.amount !== undefined)
            ? `<p>Amount: ${Number(data.amount).toFixed(2)} ${data.currency || ''}</p>`
            : '';
          const txnLine = data.gateway_txn_id
            ? `<div class="ref-badge"><strong>Txn:</strong> ${data.gateway_txn_id}</div>`
            : '';
          app.innerHTML = `
            <div class="icon">✅</div>
            <h1 class="ok">Payment received</h1>
            <p>Reference: ${tokenId}</p>
            ${amountLine}
            ${txnLine}`;
        } else if (data.status === 'PENDING') {
          setTimeout(poll, 3000);
        } else {
          app.innerHTML = `
            <div class="icon">⚠️</div>
            <h1 class="failed">Payment ${data.status?.toLowerCase() || 'not completed'}</h1>
            <p>Please contact support with reference ${tokenId}</p>`;
        }
      } catch (e) {
        app.innerHTML = `<h1 class="failed">Could not check status. Please refresh.</h1>`;
      }
    }

    poll();
  </script>
</body>
</html>
