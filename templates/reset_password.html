<!DOCTYPE html>
<html>
<head>
<title>Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:       #0078D7;
    --blue-dark:  #005a9e;
    --blue-glow:  rgba(0, 120, 215, 0.15);
    --green:      #16a34a;
    --green-bg:   #f0fdf4;
    --green-bdr:  #bbf7d0;
    --red:        #dc2626;
    --red-bg:     #fff1f2;
    --red-bdr:    #fecdd3;
    --bg:         #e8f2fc;
    --card:       #ffffff;
    --text:       #1a2340;
    --muted:      #6b7a99;
    --border:     #dde4f0;
    --input-bg:   #f7f9fc;
  }

  body {
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ── Background blobs ── */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    pointer-events: none;
  }
  body::before {
    width: 500px; height: 500px;
    background: radial-gradient(circle, #a8d0f5, #c5e1fb);
    top: -130px; left: -110px;
  }
  body::after {
    width: 400px; height: 400px;
    background: radial-gradient(circle, #bee3fc, #ddf0ff);
    bottom: -110px; right: -90px;
  }

  /* ── Container ── */
  .auth-container {
    position: relative;
    z-index: 2;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* ── Card ── */
  .auth-box {
    background: var(--card);
    width: 420px;
    border-radius: 24px;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.9) inset,
      0 24px 60px rgba(0,70,160,0.13),
      0 4px 16px rgba(0,120,215,0.07);
    padding: 44px 40px 40px;
    animation: cardRise 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes cardRise {
    from { opacity: 0; transform: translateY(28px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Icon badge ── */
  .icon-badge {
    width: 62px; height: 62px;
    background: linear-gradient(135deg, #e8f3fd, #cce4f9);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 22px;
    box-shadow: 0 4px 14px rgba(0,120,215,0.14);
    animation: cardRise 0.55s 0.08s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .icon-badge i { font-size: 26px; color: var(--blue); }

  /* ── Headings ── */
  .auth-box h3 {
    text-align: center;
    font-size: 1.45rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: -0.3px;
    animation: cardRise 0.55s 0.12s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .subtitle {
    text-align: center;
    font-size: 0.87rem;
    color: var(--muted);
    margin-bottom: 28px;
    line-height: 1.55;
    animation: cardRise 0.55s 0.16s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  /* ── Email display pill ── */
  .email-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f0f7ff;
    border: 1.5px solid #c7dff7;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 22px;
    animation: cardRise 0.55s 0.18s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .email-pill i { color: var(--blue); font-size: 14px; flex-shrink: 0; }
  .email-pill span {
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--blue-dark);
    word-break: break-all;
  }
  /* Hidden email input for form submission */
  .email-pill input { display: none; }

  /* ── Field groups ── */
  .field-group {
    margin-bottom: 16px;
    animation: cardRise 0.55s 0.22s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .field-group + .field-group { animation-delay: 0.27s; }

  .field-label {
    display: block;
    font-size: 0.79rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .input-wrap { position: relative; }
  .input-wrap .input-icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: #a0aec0;
    font-size: 14px;
    pointer-events: none;
    transition: color 0.2s;
  }
  .input-wrap .toggle-eye {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    color: #a0aec0;
    font-size: 14px;
    cursor: pointer;
    transition: color 0.2s;
    background: none;
    border: none;
    padding: 0;
    line-height: 1;
  }
  .input-wrap .toggle-eye:hover { color: var(--blue); }
  .input-wrap:focus-within .input-icon { color: var(--blue); }

  .auth-box input[type="password"],
  .auth-box input[type="text"],
  .auth-box input {
    width: 100%;
    padding: 11px 42px 11px 40px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--input-bg);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.93rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.22s, box-shadow 0.22s, background 0.22s;
  }
  .auth-box input:focus {
    border-color: var(--blue);
    background: #fff;
    box-shadow: 0 0 0 4px var(--blue-glow);
  }

  /* ── Strength meter ── */
  .strength-wrap {
    margin-top: 8px;
    display: none;
  }
  .strength-track {
    height: 4px;
    background: #e2e8f0;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 5px;
  }
  .strength-bar {
    height: 100%;
    border-radius: 4px;
    width: 0%;
    transition: width 0.3s, background 0.3s;
  }
  .strength-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
  }

  /* ── Match indicator ── */
  .match-hint {
    font-size: 0.76rem;
    font-weight: 600;
    margin-top: 6px;
    display: none;
    align-items: center;
    gap: 5px;
  }
  .match-hint.ok    { color: var(--green); display: flex; }
  .match-hint.err   { color: var(--red);   display: flex; }

  /* ── Requirements checklist ── */
  .req-list {
    margin-top: 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 12px;
  }
  .req-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: #94a3b8;
    transition: color 0.2s;
  }
  .req-item i { font-size: 10px; transition: color 0.2s; }
  .req-item.met { color: var(--green); }
  .req-item.met i { color: var(--green); }

  /* ── Button ── */
  .auth-box button[type="submit"] {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    background: linear-gradient(135deg, #1a85e8, var(--blue-dark));
    border: none;
    border-radius: 11px;
    color: white;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.97rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.2px;
    position: relative;
    overflow: hidden;
    transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
    box-shadow: 0 4px 18px rgba(0,120,215,0.32);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    animation: cardRise 0.55s 0.32s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .auth-box button[type="submit"]::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
    pointer-events: none;
  }
  .auth-box button[type="submit"]:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(0,120,215,0.38);
  }
  .auth-box button[type="submit"]:active { transform: translateY(0); }

  /* ── Flash messages ── */
  .status-message {
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 18px;
    font-size: 0.86rem;
    display: flex;
    align-items: flex-start;
    gap: 9px;
    line-height: 1.45;
    animation: cardRise 0.4s ease both;
  }
  .status-message i { margin-top: 1px; flex-shrink: 0; }
  .status-message.error   { background: var(--red-bg);   border: 1px solid var(--red-bdr);   color: #b42318; }
  .status-message.success { background: var(--green-bg); border: 1px solid var(--green-bdr); color: #067647; }

  /* ── Divider ── */
  hr.divider {
    border: none;
    border-top: 1.5px solid var(--border);
    margin: 22px 0 0;
  }
  .back-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 18px;
    font-size: 0.84rem;
    color: var(--blue);
    text-decoration: none;
    font-weight: 500;
    transition: gap 0.2s, opacity 0.2s;
    animation: cardRise 0.55s 0.38s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .back-link:hover { gap: 10px; opacity: 0.8; }
</style>
</head>

<body>
<div class="auth-container">
  <div class="auth-box">

    <!-- Icon -->
    <div class="icon-badge">
      <i class="fas fa-shield-halved"></i>
    </div>

    <h3>Reset Password</h3>
    <p class="subtitle">Create a strong new password for your account.</p>

    <!-- Flash messages (Jinja2) -->
    {% if error_message %}
      <div class="status-message error">
        <i class="fas fa-exclamation-circle"></i>{{ error_message }}
      </div>
    {% endif %}
    {% if success_message %}
      <div class="status-message success">
        <i class="fas fa-check-circle"></i>{{ success_message }}
      </div>
    {% endif %}

    <form method="POST" id="resetForm" onsubmit="return validateForm()">

      <!-- Email display (read-only visual pill + hidden input) -->
      <div class="email-pill">
        <i class="fas fa-envelope"></i>
        <span>{{ email }}</span>
        <input name="email" value="{{ email }}" readonly>
      </div>

      <!-- New Password -->
      <div class="field-group">
        <label class="field-label" for="pwdInput">New Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" name="password" id="pwdInput"
                 placeholder="Enter new password" required
                 oninput="checkStrength(); checkMatch();">
          <button type="button" class="toggle-eye" onclick="togglePwd('pwdInput', this)">
            <i class="fas fa-eye"></i>
          </button>
        </div>

        <!-- Strength meter -->
        <div class="strength-wrap" id="strengthWrap">
          <div class="strength-track">
            <div class="strength-bar" id="strengthBar"></div>
          </div>
          <span class="strength-label" id="strengthLabel">Weak</span>
        </div>

        <!-- Requirements checklist -->
        <div class="req-list">
          <div class="req-item" id="req-len"><i class="fas fa-circle"></i> 8+ characters</div>
          <div class="req-item" id="req-upper"><i class="fas fa-circle"></i> Uppercase letter</div>
          <div class="req-item" id="req-num"><i class="fas fa-circle"></i> Number</div>
          <div class="req-item" id="req-special"><i class="fas fa-circle"></i> Special character</div>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="field-group">
        <label class="field-label" for="confirmInput">Confirm Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock-open input-icon"></i>
          <input type="password" name="confirm" id="confirmInput"
                 placeholder="Re-enter new password" required
                 oninput="checkMatch();">
          <button type="button" class="toggle-eye" onclick="togglePwd('confirmInput', this)">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="match-hint" id="matchHint">
          <i class="fas fa-check-circle"></i> <span>Passwords match</span>
        </div>
      </div>

      <button type="submit">
        <i class="fas fa-lock"></i> Update Password
      </button>

    </form>

    <hr class="divider">

    <a href="{{ url_for('home') }}" class="back-link">
      <i class="fas fa-arrow-left"></i> Back to Login
    </a>

  </div>
</div>

<script>
  /* ── SHOW / HIDE PASSWORD ── */
  function togglePwd(inputId, btn) {
    const inp = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
      inp.type = 'password';
      icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
  }

  /* ── PASSWORD STRENGTH ── */
  function checkStrength() {
    const val = document.getElementById('pwdInput').value;
    const wrap = document.getElementById('strengthWrap');
    const bar  = document.getElementById('strengthBar');
    const lbl  = document.getElementById('strengthLabel');

    wrap.style.display = val.length ? 'block' : 'none';

    let score = 0;
    const hasLen     = val.length >= 8;
    const hasUpper   = /[A-Z]/.test(val);
    const hasNum     = /[0-9]/.test(val);
    const hasSpecial = /[^A-Za-z0-9]/.test(val);

    if (hasLen)     score++;
    if (hasUpper)   score++;
    if (hasNum)     score++;
    if (hasSpecial) score++;

    // Update checklist
    setReq('req-len',     hasLen);
    setReq('req-upper',   hasUpper);
    setReq('req-num',     hasNum);
    setReq('req-special', hasSpecial);

    // Bar
    const states = [
      { w: '25%', bg: '#ef4444', label: 'Weak' },
      { w: '50%', bg: '#f97316', label: 'Fair' },
      { w: '75%', bg: '#eab308', label: 'Good' },
      { w: '100%',bg: '#16a34a', label: 'Strong' },
    ];
    const s = states[score - 1] || states[0];
    bar.style.width      = s.w;
    bar.style.background = s.bg;
    lbl.textContent      = s.label;
    lbl.style.color      = s.bg;
  }

  function setReq(id, met) {
    const el = document.getElementById(id);
    el.classList.toggle('met', met);
    const icon = el.querySelector('i');
    icon.className = met ? 'fas fa-check-circle' : 'fas fa-circle';
  }

  /* ── PASSWORD MATCH ── */
  function checkMatch() {
    const pwd     = document.getElementById('pwdInput').value;
    const confirm = document.getElementById('confirmInput').value;
    const hint    = document.getElementById('matchHint');

    if (!confirm.length) { hint.className = 'match-hint'; return; }

    if (pwd === confirm) {
      hint.className = 'match-hint ok';
      hint.innerHTML = '<i class="fas fa-check-circle"></i><span>Passwords match</span>';
    } else {
      hint.className = 'match-hint err';
      hint.innerHTML = '<i class="fas fa-times-circle"></i><span>Passwords do not match</span>';
    }
  }

  /* ── FORM VALIDATION ── */
  function validateForm() {
    const pwd     = document.getElementById('pwdInput').value;
    const confirm = document.getElementById('confirmInput').value;
    if (pwd !== confirm) {
      document.getElementById('matchHint').className = 'match-hint err';
      document.getElementById('matchHint').innerHTML =
        '<i class="fas fa-times-circle"></i><span>Passwords do not match</span>';
      return false;
    }
    if (pwd.length < 8) {
      alert('Password must be at least 8 characters.');
      return false;
    }
    return true;
  }
</script>
</body>
</html>
