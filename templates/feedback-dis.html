<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Feedback</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f7f9fb;
      margin: 0;
      padding: 0;
    }

    .feedback-section {
      text-align: center;
      padding: 60px 20px 40px;
      background: linear-gradient(to right, #f3f4f7, #eaf1f9);
      margin: 40px 0;
    }

    .feedback-heading {
      font-size: 28px;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 25px;
      font-family: 'Segoe UI', sans-serif;
    }

    .feedback-scroll-wrapper {
      position: relative;
      max-width: 1100px;
      margin: 0 auto;
      overflow: hidden;
    }

    .feedback-container {
  display: flex;
  overflow-x: hidden !important;     /* Prevent native scrolling */
  scroll-behavior: smooth;
  gap: 30px;
  pointer-events: none;              /* Disable mouse dragging scroll */
}


    .feedback-item {
      flex: 0 0 auto;
      background-color: white;
      border-radius: 12px;
      padding: 20px 30px;
      min-width: 280px;
      max-width: 400px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
      font-style: italic;
      font-size: 17px;
      color: #333;
      font-family: 'Georgia', serif;
      transition: transform 0.2s ease;
    }

    .feedback-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .feedback-item span {
      display: block;
      margin-top: 12px;
      font-style: normal;
      font-weight: 600;
      color: #007BFF;
      text-align: right;
    }

    /* Navigation Buttons */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 20px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      opacity: 0.85;
    }

    .nav-btn:hover {
      opacity: 1;
    }

    #prevBtn { left: -10px; }
    #nextBtn { right: -10px; }
  </style>
</head>
<body>

  <div class="feedback-section">
    <div class="feedback-heading">What Our Students Say</div>

    <div class="feedback-scroll-wrapper">
      <button id="prevBtn" class="nav-btn">&#8249;</button>
      <button id="nextBtn" class="nav-btn">&#8250;</button>

      <div class="feedback-container">
        {% for fb in feedbacks %}
          <div class="feedback-item">“{{ fb.feedback_message }}” — <span>{{ fb.name }}</span></div>
        {% endfor %}
      </div>
    </div>
  </div>

<script>
  const container = document.querySelector(".feedback-container");
  const items = document.querySelectorAll(".feedback-item");
  let index = 0;
  let timer;

  function slideToIndex() {
    const itemWidth = items[0].offsetWidth + 30;
    container.scrollTo({
      left: index * itemWidth,
      behavior: "smooth"
    });
  }

  function autoSlide() {
    slideToIndex();
    index = (index + 1) % items.length;
    timer = setTimeout(autoSlide, 50000);  // Wait 50 seconds
  }

  autoSlide();
</script>


</body>
</html>
