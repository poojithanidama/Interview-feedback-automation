

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Application - Chakora Hub</title>
    <style>
        .top-header {
            background: linear-gradient(90deg, #3e70d6, #4b8bff);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }

        .top-header img.logo {
            height: 55px;
        }

        .top-header .title {
            font-size: 22px;
            font-weight: 700;
        }

        .top-header .spacer {
            width: 55px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
        }

        .page-content {
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        /* Search Box */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
        }

        .search-box input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
        }

        .search-box button {
            padding: 14px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        /* Application Details */
        .app-details {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 40px;
            display: none;
        }

        .app-details h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .detail-label {
            font-weight: 600;
            color: #555;
        }

        .detail-value {
            color: #333;
        }

        /* Progress Tracker - MATCHING YOUR SKETCH */
        .progress-tracker {
            margin: 60px 0;
            padding: 0 20px;
            display: none;
        }

        .tracker-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .tracker-title {
            color: #00a86b;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .tracker-subtitle {
            color: #00a86b;
            font-size: 18px;
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding: 40px 0;
        }

        /* Blue line connecting dots */
        .timeline-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 4px;
            background: #2563eb;
            transform: translateY(-50%);
            z-index: 1;
        }

        .timeline-progress {
            position: absolute;
            height: 100%;
            background: #00a86b;
            transition: width 0.5s ease;
            z-index: 2;
        }

        /* Stages container */
        .stages {
            display: flex;
            justify-content: space-between;
            position: relative;
            z-index: 3;
        }

        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Blue dots */
        .stage-dot {
            width: 20px;
            height: 20px;
            background: #2563eb;
            border-radius: 50%;
            margin-bottom: 20px;
            transition: all 0.3s;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .stage.completed .stage-dot {
            background: #00a86b;
            width: 24px;
            height: 24px;
        }

        .stage.current .stage-dot {
            background: #00a86b;
            width: 30px;
            height: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(0, 168, 107, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(0, 168, 107, 0);
            }
        }

        /* Stage labels - GREEN text like your sketch */
        .stage-label {
            text-align: center;
            font-weight: 600;
            color: #00a86b;
            font-size: 14px;
            max-width: 100px;
            line-height: 1.3;
        }

        .stage.pending .stage-label {
            color: #999;
        }

        /* Left and right labels - BLUE text like your sketch */
        .side-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            font-weight: bold;
            font-size: 16px;
            color: #2563eb;
        }

        .label-left {
            text-align: left;
        }

        .label-right {
            text-align: right;
        }

        /* Loading and Error states */
        .loading, .error {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #d32f2f;
        }

        /* History Section */
        .history-section {
            margin-top: 40px;
            display: none;
        }

        .history-section h3 {
            color: #333;
            margin-bottom: 20px;
        }

        .history-item {
            background: #f8f9ff;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .history-date {
            font-size: 12px;
            color: #999;
        }

        .history-status {
            font-weight: 600;
            color: #333;
            margin: 5px 0;
        }

        @media (max-width: 768px) {
            .stages {
                flex-direction: column;
                gap: 30px;
            }

            .timeline-line {
                width: 4px;
                height: 100%;
                left: 50%;
                transform: translateX(-50%);
            }

            .stage {
                flex-direction: row;
                gap: 20px;
            }

            .stage-label {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="top-header">
        <img src="/static/logo.png" class="logo" alt="ChakoraHub">
        <div class="title">Track Application</div>
        <div class="spacer"></div>
    </div>

    <div class="page-content">
    <div class="container">
        <h1>Track Your Application</h1>
        <p class="subtitle">Enter your Application ID to check the status</p>

        <!-- Search Box -->
        <div class="search-box">
            <input type="text" id="applicationId" placeholder="Enter Application ID (e.g., APP_20251102_XXXXX)">
            <button onclick="trackApplication()">Track Status</button>
        </div>

        <!-- Loading State -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading your application status...</p>
        </div>

        <!-- Error State -->
        <div class="error" id="error"></div>

        <!-- Application Details -->
        <div class="app-details" id="appDetails">
            <h3>Application Details</h3>
            <div class="detail-row">
                <span class="detail-label">Application ID:</span>
                <span class="detail-value" id="detailAppId"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Name:</span>
                <span class="detail-value" id="detailName"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Email:</span>
                <span class="detail-value" id="detailEmail"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Applied Date:</span>
                <span class="detail-value" id="detailDate"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Current Status:</span>
                <span class="detail-value" id="detailStatus"></span>
            </div>
        </div>

        <!-- Progress Tracker - MATCHING YOUR SKETCH -->
        <div class="progress-tracker" id="progressTracker">
            <div class="tracker-header">
                <div class="tracker-title">Processed</div>
                <div class="tracker-subtitle">The Resume</div>
            </div>

            <div class="timeline">
                <div class="timeline-line">
                    <div class="timeline-progress" id="timelineProgress"></div>
                </div>
                
                <div class="stages" id="stages">
                    <!-- Stages will be dynamically inserted -->
                </div>
            </div>

            <div class="side-labels">
                <div class="label-left">Resume<br>Submitted</div>
                <div class="label-right">Mail sent<br>to<br>applicant</div>
            </div>
        </div>

        <!-- History Section -->
        <div class="history-section" id="historySection">
            <h3>Status History</h3>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        // Auto-populate from URL parameter
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const appId = urlParams.get('id');
            if (appId) {
                document.getElementById('applicationId').value = appId;
                trackApplication();
            }
        };

        async function trackApplication() {
            const applicationId = document.getElementById('applicationId').value.trim();
            
            if (!applicationId) {
                showError('Please enter an Application ID');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('appDetails').style.display = 'none';
            document.getElementById('progressTracker').style.display = 'none';
            document.getElementById('historySection').style.display = 'none';

            try {
                // Replace with your API Gateway endpoint
                const response = await fetch(`/api/onboarding/application-status/${applicationId}`);
                if (!response.ok) {
                    throw new Error('Application not found');
                }

                const data = await response.json();

// If backend returns { applications: [...] }
let application;

if (Array.isArray(data.applications)) {
    // Find by ID, or just take the first match
    application = data.applications.find(
        (app) => app.application_id === applicationId
    );

    if (!application) {
        showError('Application not found');
        return;
    }
} else {
    // Fallback if backend ever returns a single object
    application = data;
}

displayApplication(application);
                
            } catch (error) {
                showError(error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayApplication(data) {
    const currentStatus = data.current_status || {};

    document.getElementById('detailAppId').textContent = data.application_id || '';
    document.getElementById('detailName').textContent = data.applicant_name || '';
    document.getElementById('detailEmail').textContent = data.email || '';
    document.getElementById('detailDate').textContent =
        data.applied_date ? new Date(data.applied_date).toLocaleDateString() : '';
    document.getElementById('detailStatus').textContent = currentStatus.name || '';
    document.getElementById('appDetails').style.display = 'block';

    // -------- Progress tracker --------
    const DEFAULT_STATUSES = [
        { order: 1, name: 'Resume Uploaded' },
        { order: 2, name: 'Pending for Review' },
        { order: 3, name: '1st Round Interview' },
        { order: 4, name: '2nd Round Interview' },
        { order: 5, name: 'Selected' },
        { order: 6, name: 'Rejected' },
        { order: 7, name: 'Evaluation in Progress' },
        { order: 8, name: 'Consent from Applicant' },
        { order: 9, name: 'Offer Letter Sent' },
    ];

    const stages = document.getElementById('stages');
    stages.innerHTML = '';

    const all_statuses = data.all_statuses || DEFAULT_STATUSES;
    const currentOrder = currentStatus.order;
    let progressPercent = 0;

    all_statuses.forEach((status, index) => {
        const stage = document.createElement('div');
        stage.className = 'stage';

        if (status.order < currentOrder) {
            stage.classList.add('completed');
            progressPercent = ((index + 1) / all_statuses.length) * 100;
        } else if (status.order === currentOrder) {
            stage.classList.add('current');
            progressPercent = ((index + 0.5) / all_statuses.length) * 100;
        } else {
            stage.classList.add('pending');
        }

        stage.innerHTML = `
            <div class="stage-dot"></div>
            <div class="stage-label">${status.name}</div>
        `;

        stages.appendChild(stage);
    });

    setTimeout(() => {
        document.getElementById('timelineProgress').style.width = progressPercent + '%';
    }, 100);

    document.getElementById('progressTracker').style.display = 'block';

    // History (if you later add it from backend)
    if (data.history && data.history.length > 0) {
        const historyList = document.getElementById('historyList');
        historyList.innerHTML = '';

        data.history.forEach((item) => {
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            historyItem.innerHTML = `
                <div class="history-date">${new Date(item.date).toLocaleString()}</div>
                <div class="history-status">${item.new_status}</div>
                ${item.notes ? `<div>${item.notes}</div>` : ''}
            `;
            historyList.appendChild(historyItem);
        });

        document.getElementById('historySection').style.display = 'block';
    }
}


        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
    </div>
</body>
</html>
