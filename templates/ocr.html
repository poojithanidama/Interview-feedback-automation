<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChakoraHub - OCR & Resume Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }
        .container {
            max-width: 800px;
        }
        .card {
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            margin-bottom: 2rem;
        }
        .result-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 1rem;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .btn-primary {
            background: #667eea;
            border: none;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-white text-center mb-4">📸 OCR & Resume Analyzer</h1>

        <!-- Notes Scanner -->
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">📝 Assignment/Notes Scanner</h4>
            </div>
            <div class="card-body">
                <form id="notesForm">
                    <div class="mb-3">
                        <label class="form-label">Student ID</label>
                        <input type="text" class="form-control" id="studentId" required placeholder="e.g., STU001">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Subject</label>
                        <input type="text" class="form-control" id="subject" required placeholder="e.g., Mathematics">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Upload Notes (Image or PDF)</label>
                        <input type="file" class="form-control" id="notesFile" accept="image/*,application/pdf" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <span id="notesSpinner" class="spinner-border spinner-border-sm d-none"></span>
                        Scan Notes
                    </button>
                </form>
                <div id="notesResult" class="d-none">
                    <h5 class="mt-4">✅ Extraction Result:</h5>
                    <div class="result-box" id="notesText"></div>
                    <div class="mt-2">
                        <strong>Word Count:</strong> <span id="notesWordCount"></span><br>
                        <strong>Document ID:</strong> <span id="notesDocId"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Resume Analyzer -->
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">💼 Resume Analyzer</h4>
            </div>
            <div class="card-body">
                <form id="resumeForm">
                    <div class="mb-3">
                        <label class="form-label">Candidate Name</label>
                        <input type="text" class="form-control" id="candidateName" required placeholder="e.g., John Doe">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Upload Resume (Image or PDF)</label>
                        <input type="file" class="form-control" id="resumeFile" accept="image/*,application/pdf" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <span id="resumeSpinner" class="spinner-border spinner-border-sm d-none"></span>
                        Analyze Resume
                    </button>
                </form>
                <div id="resumeResult" class="d-none">
                    <h5 class="mt-4">📊 Analysis Result:</h5>
                    
                    <h6 class="mt-3">💡 Skills Found:</h6>
                    <div class="result-box" id="resumeSkills"></div>
                    
                    <h6 class="mt-3">💼 Experience:</h6>
                    <div class="result-box" id="resumeExperience"></div>
                    
                    <h6 class="mt-3">🎓 Education:</h6>
                    <div class="result-box" id="resumeEducation"></div>
                    
                    <h6 class="mt-3">✨ AI Suggestions:</h6>
                    <div class="result-box" id="resumeSuggestions"></div>
                    
                    <div class="mt-2">
                        <strong>Analysis ID:</strong> <span id="resumeAnalysisId"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Configuration - UPDATE THIS WITH YOUR SERVICE URL
        const API_BASE = 'http://localhost:5060';  // Change to your EC2 IP or domain

        // Notes Scanner Form
        document.getElementById('notesForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const spinner = document.getElementById('notesSpinner');
            const resultDiv = document.getElementById('notesResult');
            
            spinner.classList.remove('d-none');
            resultDiv.classList.add('d-none');
            
            try {
                const formData = new FormData();
                formData.append('file', document.getElementById('notesFile').files[0]);
                formData.append('student_id', document.getElementById('studentId').value);
                formData.append('subject', document.getElementById('subject').value);
                
                const response = await fetch(`${API_BASE}/api/ocr/scan-notes`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('notesText').textContent = data.extracted_text;
                    document.getElementById('notesWordCount').textContent = data.word_count;
                    document.getElementById('notesDocId').textContent = data.doc_id;
                    resultDiv.classList.remove('d-none');
                } else {
                    alert('Error: ' + (data.detail || 'Failed to scan notes'));
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                spinner.classList.add('d-none');
            }
        });

        // Resume Analyzer Form
        document.getElementById('resumeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const spinner = document.getElementById('resumeSpinner');
            const resultDiv = document.getElementById('resumeResult');
            
            spinner.classList.remove('d-none');
            resultDiv.classList.add('d-none');
            
            try {
                const formData = new FormData();
                formData.append('file', document.getElementById('resumeFile').files[0]);
                formData.append('candidate_name', document.getElementById('candidateName').value);
                
                const response = await fetch(`${API_BASE}/api/ocr/analyze-resume`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const analysis = data.ai_analysis;
                    
                    // Display skills
                    document.getElementById('resumeSkills').textContent = 
                        Array.isArray(analysis.skills) ? analysis.skills.join(', ') : JSON.stringify(analysis.skills, null, 2);
                    
                    // Display experience
                    document.getElementById('resumeExperience').textContent = 
                        typeof analysis.experience === 'object' ? JSON.stringify(analysis.experience, null, 2) : analysis.experience;
                    
                    // Display education
                    document.getElementById('resumeEducation').textContent = 
                        Array.isArray(analysis.education) ? analysis.education.join('\n') : JSON.stringify(analysis.education, null, 2);
                    
                    // Display suggestions
                    document.getElementById('resumeSuggestions').textContent = 
                        Array.isArray(analysis.suggestions) ? analysis.suggestions.map((s, i) => `${i + 1}. ${s}`).join('\n') : JSON.stringify(analysis.suggestions, null, 2);
                    
                    document.getElementById('resumeAnalysisId').textContent = data.analysis_id;
                    resultDiv.classList.remove('d-none');
                } else {
                    alert('Error: ' + (data.detail || 'Failed to analyze resume'));
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
