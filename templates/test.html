<!DOCTYPE html>
<html>
<head>
    <title>Course IDs</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        .course { display: inline-block; background: #667eea; color: white; padding: 10px 20px; margin: 5px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Course IDs ({{ course_ids|length }})</h1>
    {% for course_id in course_ids %}
        <div class="course">{{ course_id }}</div>
    {% endfor %}
</body>
</html>
