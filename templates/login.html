{% extends "base.html" %}
{% block title %}System Authentication - OPE{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="glass-card p-5">
            <div class="text-center mb-4">
                <i class="bi bi-shield-check text-gradient-purple" style="font-size: 3rem;"></i>
                <h2 class="mt-3">Welcome Back</h2>
                <p class="text-secondary">Authenticate to access your examination portal</p>
            </div>

            {% if error %}
            <div class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger mb-4" style="border-radius: 8px;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label text-secondary" style="font-size: 0.9rem;">Username</label>
                    <div class="input-group">
                        <span class="input-group-text border-0 bg-dark bg-opacity-20 text-secondary" style="border-top-left-radius: 8px; border-bottom-left-radius: 8px;">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" class="form-control form-control-premium" id="username" name="username" placeholder="Enter username" required style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-secondary" style="font-size: 0.9rem;">Password</label>
                    <div class="input-group">
                        <span class="input-group-text border-0 bg-dark bg-opacity-20 text-secondary" style="border-top-left-radius: 8px; border-bottom-left-radius: 8px;">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control form-control-premium" id="password" name="password" placeholder="Enter password" required style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                    </div>
                </div>

                <button type="submit" class="btn btn-premium w-100 py-3 d-flex align-items-center justify-content-center gap-2">
                    <span>Authenticate</span> <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <!-- Demo Accounts - Candidate Only -->
            <div class="mt-4 pt-4 border-top border-secondary border-opacity-10">
                <h6 class="text-secondary mb-2" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;">Demo Accounts</h6>
                <div class="d-flex flex-column gap-1" style="font-size: 0.85rem; color: var(--text-secondary);">
                    <div>
                        <strong class="text-white">Candidate Account:</strong>
                        <span class="ms-1 font-monospace">candidate1</span> / <span class="font-monospace">candidate123</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
