<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:       #0078D7;
    --blue-dark:  #005a9e;
    --blue-glow:  rgba(0, 120, 215, 0.18);
    --bg-from:    #e8f2fc;
    --bg-to:      #f5f9ff;
    --card:       #ffffff;
    --text:       #1a2340;
    --muted:      #6b7a99;
    --border:     #dde4f0;
    --input-bg:   #f7f9fc;
  }

  body {
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg-from);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ── Decorative background blobs ── */
  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    pointer-events: none;
  }
  body::before {
    width: 520px; height: 520px;
    background: radial-gradient(circle, #a8d0f5, #c5e1fb);
    top: -140px; left: -120px;
  }
  body::after {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #bee3fc, #ddf0ff);
    bottom: -120px; right: -100px;
  }

  /* ── Card ── */
  .auth-container {
    position: relative;
    z-index: 2;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .auth-box {
    background: var(--card);
    width: 420px;
    border-radius: 24px;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.9) inset,
      0 24px 60px rgba(0, 70, 160, 0.13),
      0 4px 16px rgba(0, 120, 215, 0.08);
    padding: 44px 40px 40px;
    animation: cardRise 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes cardRise {
    from { opacity: 0; transform: translateY(28px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)    scale(1);    }
  }

  /* ── Icon badge ── */
  .icon-badge {
    width: 62px; height: 62px;
    background: linear-gradient(135deg, #e8f3fd, #cce4f9);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 22px;
    box-shadow: 0 4px 14px rgba(0,120,215,0.15);
    animation: cardRise 0.55s 0.08s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .icon-badge i { font-size: 26px; color: var(--blue); }

  /* ── Headings ── */
  .auth-box h3 {
    text-align: center;
    font-size: 1.45rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: -0.3px;
    animation: cardRise 0.55s 0.12s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  .auth-box .subtitle {
    text-align: center;
    font-size: 0.87rem;
    color: var(--muted);
    margin-bottom: 30px;
    line-height: 1.5;
    animation: cardRise 0.55s 0.16s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  /* ── Field groups ── */
  .field-group {
    margin-bottom: 16px;
    animation: cardRise 0.55s 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .field-group + .field-group {
    animation-delay: 0.25s;
  }

  .field-label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .input-wrap {
    position: relative;
  }
  .input-wrap i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #a0aec0;
    font-size: 14px;
    pointer-events: none;
    transition: color 0.2s;
  }

  .auth-box select,
  .auth-box input[type="email"],
  .auth-box input[type="text"],
  .auth-box input {
    width: 100%;
    padding: 11px 14px 11px 40px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--input-bg);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.93rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.22s, box-shadow 0.22s, background 0.22s;
    appearance: none;
    -webkit-appearance: none;
  }

  .auth-box select { cursor: pointer; }

  /* Custom select arrow */
  .select-wrap::after {
    content: '\f078';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: #a0aec0;
    pointer-events: none;
  }

  .auth-box select:focus,
  .auth-box input:focus {
    border-color: var(--blue);
    background: #fff;
    box-shadow: 0 0 0 4px var(--blue-glow);
  }

  .auth-box select:focus ~ i,
  .auth-box input:focus ~ i,
  .input-wrap:focus-within i {
    color: var(--blue);
  }

  /* ── Button ── */
  .auth-box button {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    background: linear-gradient(135deg, #1a85e8, var(--blue-dark));
    border: none;
    border-radius: 11px;
    color: white;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.97rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.2px;
    position: relative;
    overflow: hidden;
    transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
    box-shadow: 0 4px 18px rgba(0, 120, 215, 0.35);
    animation: cardRise 0.55s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  .auth-box button::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
    pointer-events: none;
  }

  .auth-box button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(0, 120, 215, 0.4);
  }
  .auth-box button:active {
    transform: translateY(0);
    box-shadow: 0 3px 12px rgba(0, 120, 215, 0.3);
  }

  .btn-inner {
    display: flex; align-items: center; justify-content: center; gap: 9px;
  }

  /* ── Divider note ── */
  .note {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-top: 22px;
    font-size: 0.8rem;
    color: var(--muted);
    animation: cardRise 0.55s 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .note i { font-size: 12px; color: #a0aec0; }

  /* ── Back link ── */
  .back-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 18px;
    font-size: 0.84rem;
    color: var(--blue);
    text-decoration: none;
    font-weight: 500;
    transition: gap 0.2s, opacity 0.2s;
    animation: cardRise 0.55s 0.38s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .back-link:hover { gap: 10px; opacity: 0.8; }

  .status-message {
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 0.86rem;
    line-height: 1.4;
  }
  .status-message.error {
    background: #fff1f0;
    border: 1px solid #ffc9c4;
    color: #b42318;
  }
  .status-message.success {
    background: #ecfdf3;
    border: 1px solid #abefc6;
    color: #067647;
  }

  /* ── Divider ── */
  .divider {
    border: none;
    border-top: 1.5px solid var(--border);
    margin: 24px 0 0;
    animation: cardRise 0.55s 0.33s cubic-bezier(0.34,1.56,0.64,1) both;
  }
</style>
</head>

<body>
<div class="auth-container">
  <div class="auth-box">

    <!-- Icon -->
    <div class="icon-badge">
      <i class="fas fa-key"></i>
    </div>

    <h3>Forgot Password?</h3>
    <p class="subtitle">Select your account type and enter your registered email.<br>We'll send a reset link right away.</p>

    {% if error_message %}
      <div class="status-message error">{{ error_message }}</div>
    {% endif %}
    {% if success_message %}
      <div class="status-message success">{{ success_message }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('forgot_password') }}">

      <!-- Account type -->
      <div class="field-group">
        <label class="field-label">Account Type</label>
        <div class="input-wrap select-wrap">
          <i class="fas fa-user-circle"></i>
          <select name="login_type" required>
            <option value="">— Select Account Type —</option>
            <option value="user" {% if selected_login_type == 'user' %}selected{% endif %}>User / Student</option>
            <option value="employee" {% if selected_login_type == 'employee' %}selected{% endif %}>Employee</option>
          </select>
        </div>
      </div>

      <!-- Email -->
      <div class="field-group">
        <label class="field-label">Registered Email</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input name="username" type="email" placeholder="you@example.com" value="{{ entered_username or '' }}" required>
        </div>
      </div>

      <button type="submit">
        <span class="btn-inner">
          <i class="fas fa-paper-plane"></i>
          Send Reset Link
        </span>
      </button>

    </form>

    <hr class="divider">

    <div class="note">
      <i class="fas fa-clock"></i>
      Reset link is valid for 30 minutes
    </div>

    <a href="{{ url_for('home') }}" class="back-link">
      <i class="fas fa-arrow-left"></i> Back to Login
    </a>

  </div>
</div>
</body>
</html>
