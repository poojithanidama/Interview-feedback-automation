<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asset Tracking - ChakoraHub</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
    }
    /* Sidebar */
    .sidebar {
      width: 250px;
      background: #2c3e50;
      color: #fff;
      height: 100vh;
      padding-top: 20px;
      position: fixed;
    }
    .sidebar h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 20px;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
    }
    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .sidebar ul li {
      padding: 12px 20px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .sidebar ul li:hover {
      background: #34495e;
    }
    .sidebar ul li a {
      color: #fff;
      text-decoration: none;
      display: block;
    }

    /* Submenu */
    .submenu {
      max-height: 0;
      overflow: hidden;
      background: #3d566e;
      transition: max-height 0.3s ease-out;
    }
    .submenu.open {
      max-height: 300px;
      transition: max-height 0.3s ease-in;
    }
    .submenu li {
      padding: 10px 40px;
    }
    .submenu li:hover {
      background: #4a6a89;
    }

    /* Arrow styling */
    .arrow {
      float: right;
      transition: transform 0.3s;
    }
    .arrow.rotate {
      transform: rotate(90deg);
    }

    /* Content area */
    .content {
      margin-left: 250px;
      padding: 20px;
      flex: 1;
    }
    .form-section {
      display: none;
      margin-top: 20px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input, select {
      width: 300px;
      padding: 8px;
      margin-bottom: 10px;
    }
    button {
      padding: 8px 16px;
      background: #2c3e50;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #34495e;
    }
  </style>

  <script>
    function toggleSubmenu() {
      const submenu = document.getElementById("assetSubmenu");
      const arrow = document.getElementById("assetArrow");

      submenu.classList.toggle("open");
      arrow.classList.toggle("rotate");
    }

    function showForm(formId) {
      // hide all forms
      const forms = document.querySelectorAll(".form-section");
      forms.forEach(f => f.style.display = "none");

      // show selected form
      document.getElementById(formId).style.display = "block";
    }
  </script>
</head>
<body>

  <div class="sidebar">
    <h2>ChakoraHub</h2>
    <ul>
      <li onclick="toggleSubmenu()">
        Asset Tracking <span id="assetArrow" class="arrow">▸</span>
        <ul id="assetSubmenu" class="submenu">
          <li><a href="#" onclick="showForm('laptopForm')">Laptop/Desktop Allocation</a></li>
          <li><a href="#" onclick="showForm('cardForm')">Access Cards</a></li>
          <li><a href="#" onclick="showForm('returnForm')">Return Tracking</a></li>
        </ul>
      </li>
    </ul>
  </div>

  <div class="content">
    <h1>Welcome to Asset Tracking</h1>
    <p>Select a submodule from the sidebar to manage assets.</p>

    <!-- Laptop/Desktop Allocation -->
    <div id="laptopForm" class="form-section">
      <h2>Laptop/Desktop Allocation</h2>
      <form method="POST" action="{{ url_for('laptop_allocation') }}">
        <div class="form-group">
          <label for="emp_id">Employee ID</label>
          <input type="text" name="emp_id" required>
        </div>
        <div class="form-group">
          <label for="asset_type">Asset Type</label>
          <input type="text" name="asset_type" required>
        </div>
        <div class="form-group">
          <label for="asset_tag">Asset Tag</label>
          <input type="text" name="asset_tag" required>
        </div>
        <button type="submit">Allocate</button>
      </form>
    </div>

    <!-- Access Cards -->
    <div id="cardForm" class="form-section">
      <h2>Access Cards</h2>
      <form method="POST" action="{{ url_for('access_cards') }}">
        <div class="form-group">
          <label for="emp_id">Employee ID</label>
          <input type="text" name="emp_id" required>
        </div>
        <div class="form-group">
          <label for="card_number">Card Number</label>
          <input type="text" name="card_number" required>
        </div>
        <div class="form-group">
          <label for="expiry_date">Expiry Date</label>
          <input type="date" name="expiry_date" required>
        </div>
        <button type="submit">Assign</button>
      </form>
    </div>

    <!-- Return Tracking -->
    <div id="returnForm" class="form-section">
      <h2>Return Tracking</h2>
      <form method="POST" action="{{ url_for('return_tracking') }}">
        <div class="form-group">
          <label for="emp_id">Employee ID</label>
          <input type="text" name="emp_id" required>
        </div>
        <div class="form-group">
          <label for="asset_tag">Asset Tag</label>
          <input type="text" name="asset_tag" required>
        </div>
        <div class="form-group">
          <label for="condition">Condition</label>
          <input type="text" name="condition" required>
        </div>
        <button type="submit">Return</button>
      </form>
    </div>
  </div>

</body>
</html>
