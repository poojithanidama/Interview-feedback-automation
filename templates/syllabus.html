<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Course Syllabus - ChakoraHub</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- ✅ jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Inter', 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #eef2ff, #f8fafc);
  color: #1f2937;
}
.resources-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 25px auto 0;
  padding: 14px 32px;
  background: rgba(255, 255, 255, 0.95);
  color: #667eea;
  text-decoration: none;
  border-radius: 12px;
  font-weight: 600;
  font-size: 1rem;
  transition: all 0.3s ease;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
  border: 2px solid rgba(255, 255, 255, 0.2);
  justify-content: center;
  width: 100%;
  text-align: center;
}

.resources-btn:hover {
  background: white;
  transform: translateY(-3px);
  box-shadow: 0 6px 30px rgba(0, 0, 0, 0.2);
  color: #667eea;
}


.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 30px;
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  color: white;
}

.profile-wrapper { position: relative; cursor: pointer; }

.profile-pic {
  width: 45px;
  height: 45px;
  border-radius: 50%;
}

.dropdown-menu {
  display: none;
  position: absolute;
  top: 60px;
  right: 0;
  background: white;
  border-radius: 8px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  min-width: 160px;
  overflow: hidden;
  z-index: 1000;
}
.dropdown-menu a {
  display: block;
  padding: 10px 15px;
  color: #1f2937;
  text-decoration: none;
  font-size: 15px;
  border-bottom: 1px solid #eee;
}
.dropdown-menu a:last-child { border-bottom: none; }
.dropdown-menu a:hover { background: #f3f4f6; }

.syllabus-box {
  background: #fff;
  padding: 24px;
  border-radius: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  margin-top: 16px;
}
.syllabus-box p { margin: 6px 0; }
.admin-controls { margin-top: 18px; }

.sidebar {
  height: 100vh;
  position: fixed;
  width: 240px;
  background: #1e293b;
  color: #fff;
  padding-top: 20px;
}

.sidebar a {
  display: block;
  padding: 10px 20px;
  color: #e5e7eb;
  text-decoration: none;
}
  /* ADMIN BUTTON */
  .admin-controls button {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    color: white;
    font-weight: 600;
    transition: all 0.2s;
  }

  .admin-controls button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(239,68,68,0.4);
  }

  /* BACK BUTTON */
  .back-button button {
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    padding: 12px 26px;
    border-radius: 10px;
    border: none;
    color: white;
    font-weight: 600;
    transition: all 0.2s;
  }

  .back-button button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(79,70,229,0.3);
  }
/* MODAL */
  .modal {
    display: none;
    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.7);
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: white;
    padding: 30px;
    border-radius: 16px;
    text-align: center;
    width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .modal-content h3 {
    margin-bottom: 20px;
    font-weight: 600;
  }

  .confirm-btn {
    background: #4f46e5;
    color: white;
  }

  .cancel-btn {
    background: #e5e7eb;
  }

  .modal-actions button {
    margin: 10px;
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-weight: 600;
  }

  /* MOBILE */
  @media (max-width: 768px) {
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
    }

    .content {
      margin-left: 0;
    }}
.content {
  margin-left: 250px;
  padding: 40px 30px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <img src="{{ url_for('static', filename='logo.png') }}" height="60">
  </div>

  <div class="profile-wrapper" onclick="toggleDropdown()">
    <img class="profile-pic"
         src="{{ url_for('static', filename=session.get('profile_pic', 'profile_photo/defaultpicture.jpg')) }}">
    <div class="dropdown-menu" id="dropdownMenu">
      <a href="{{ url_for('profile') }}">Profile</a>
      <a href="{{ url_for('settings') }}">Settings</a>
      <a href="#" onclick="openModal('logout')">Logout</a>
    </div>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
  <h4 class="ps-3">Courses</h4>

  {% for course in courses %}
    <a href="#" onclick="loadSyllabus({{ course.ID }}); return false;">
      {{ course.COURSE_NAME }}
    </a>
  {% endfor %}

  {% if session.get('role') == 'admin' %}
    <a href="{{ url_for('upload_page') }}" class="btn btn-success m-3">
      Upload New Syllabus
    </a>
  {% endif %}
</div>

<!-- CONTENT -->
<div class="content">
  <div id="syllabusContent">
    <h2>Welcome!</h2>
    <p>Select a course from the sidebar to view its syllabus.</p>
  </div>

<div class="back-button">
    <button onclick="goToResources()">⬅ Back to Resources</button>
  </div>

</div>

<!-- MODAL -->
<div id="confirmationModal" class="modal">
  <div class="modal-content">
    <h3 id="modalMessage">Are you sure?</h3>
    <div class="modal-actions">
      <button class="confirm-btn" id="confirmBtn">Yes</button>
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>

// dropdown
function toggleDropdown() {
  const d = document.getElementById('dropdownMenu');
  d.style.display = d.style.display === 'block' ? 'none' : 'block';
}

document.addEventListener('click', function(e) {
  const wrapper = document.querySelector('.profile-wrapper');
  if (!wrapper.contains(e.target)) {
    document.getElementById('dropdownMenu').style.display = 'none';
  }
});

let actionType = null;

function openModal(type, courseId=null) {
  actionType = {type, courseId};

  if (type === 'logout') {
    document.getElementById('modalMessage').innerText =
      "Are you sure you want to log out?";
  } else {
    document.getElementById('modalMessage').innerText =
      "Delete this syllabus?";
  }

  document.getElementById('confirmationModal').style.display = 'block';
}

function closeModal() {
  document.getElementById('confirmationModal').style.display = 'none';
}

document.getElementById('confirmBtn').addEventListener('click', function() {
  if (actionType.type === 'logout') {
    window.location.href = "{{ url_for('logout') }}";
  } else {
    deleteSyllabus(actionType.courseId, true);
  }
  closeModal();
});


// ✅ WORKING AJAX LOAD
function loadSyllabus(courseId) {
  $.ajax({
    url: `/syllabus/${courseId}`,
    type: "GET",
    dataType: "json",

    success: function(data) {
      const div = document.getElementById('syllabusContent');

      if (data && data.pdf_url) {
        div.innerHTML = `
          <h2>${data.course_name} - Syllabus</h2>
          <div class="syllabus-box">
            <p><strong>Duration:</strong> ${data.duration || 'Not specified'}</p>
            <p><strong>Content:</strong> ${data.content || 'No details available'}</p>
            <embed src="${data.pdf_url}" width="100%" height="600px" type="application/pdf"/>
          </div>
          ${data.is_admin ? `
          <div class="admin-controls">
            <button onclick="openModal('delete', ${courseId})">Delete Syllabus</button>
          </div>` : ''}
        `;
      } else {
        div.innerHTML = `<p>No syllabus uploaded for this course yet.</p>`;
      }
    },

    error: function(xhr) {
      console.log("ERROR:", xhr.responseText);
      document.getElementById('syllabusContent').innerHTML =
        `<p style="color:red;">Error loading syllabus</p>`;
    }
  });
}


// ✅ WORKING AJAX DELETE
function deleteSyllabus(courseId, confirmed=false) {

  if (!confirmed) {
    openModal('delete', courseId);
    return;
  }

  $.ajax({
    url: `/syllabus/delete/${courseId}`,
    type: "POST",
    dataType: "json",

    success: function(result) {
      if (result && result.success) {
        alert("Syllabus deleted successfully.");

        document.getElementById('syllabusContent').innerHTML =
          `<h2>Welcome!</h2><p>Select a course from the sidebar.</p>`;
      } else {
        alert("Failed to delete syllabus.");
      }
    },

    error: function(xhr) {
      console.log("DELETE ERROR:", xhr.responseText);
      alert("Server error");
    }
  });
}
// ✅ FIXED NAVIGATION (NO AJAX)
function goToResources() {
  fetch("/resources")
    .then(res => res.text())
    .then(html => {
      // FULL PAGE REPLACE (including CSS)
      document.open();
      document.write(html);
      document.close();
    })
    .catch(err => {
      console.error(err);
      alert("Failed to load resources");
    });
}


</script>

</body>
</html>
